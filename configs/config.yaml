# Project-wide configuration for the Elliptic graph anomaly detection project

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  figures_dir: "outputs/figures"
  models_dir: "outputs/models"

dataset:
  name: "elliptic_bitcoin"
  num_time_steps: 49
  # Temporal split boundaries, following the standard convention for this dataset
  train_time_steps: [1, 30]
  val_time_steps: [31, 40]
  test_time_steps: [41, 49]

graph:
  # Whether unknown-labeled nodes participate in message passing
  # even though they are excluded from the loss computation
  include_unknown_in_message_passing: true

preprocessing:
  # Elliptic's released features are already z-score standardized by the
  # dataset creators. This flag controls whether an additional RobustScaler
  # pass (fit on the training split only) is applied on top of that. This is
  # an ablation axis, not a fixed decision: both settings should be evaluated
  # against the validation split during Phase 3, and only the winner carries
  # forward to the sealed-test run.
  additional_scaling:
    enabled: false          # RESOLVED in Phase 3: RobustScaler on top of the
                            # already-standardized features degraded val F1
                            # from 0.6267 to 0.4980; do not re-enable without
                            # a new, separately justified experiment.
    method: "robust"
    fit_split: "train"


model:
  architecture: "GraphSAGE"
  hidden_channels: 128       # RESOLVED in Phase 3 single-axis ablation
  num_layers: 3              # RESOLVED in Phase 3 single-axis ablation
  dropout: 0.3               # RESOLVED in Phase 3 single-axis ablation
  decision_threshold: 0.60   # RESOLVED in Phase 3 threshold sweep;
                             # F1-optimal, modest gain over default 0.50

training:
  device: "cpu"
  random_seed: 42
  batch_size: null            # intentionally null: full-batch training used
                              # throughout (no mini-batch sampling), not an
                              # unresolved decision
  learning_rate: 0.01         # RESOLVED (never actually ablated; carried
                              # over from Phase 2 baseline as-is)
  num_epochs: 100             # RESOLVED (fixed budget used throughout;
                              # not ablated)
  weight_decay: 5.0e-4        # baseline default; never ablated
  class_weight_scheme: "none" # RESOLVED in Phase 3: unweighted loss beat
                              # inverse and sqrt-inverse weighting once the
                              # architecture confound was corrected

logging:
  experiment_name: "elliptic_graphsage_v1"